name: Release to npm

on:
  workflow_dispatch:
    inputs:
      version:
        description: Package version to publish, matching package.json
        required: true
        type: string

permissions: {}

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'tapayadot/checkout-node' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      sha256: ${{ steps.digest.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Check requested version
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs'
          const version = process.env.EXPECTED_VERSION
          if (!/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(version)) {
            throw new Error('Only stable semantic versions can be released')
          }
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'))
          if (pkg.version !== version) throw new Error('Requested version does not match package.json')
          JS
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm pack --out release/checkout.tgz
      - name: Record release digest
        id: digest
        run: |
          node --input-type=module <<'JS'
          import { createHash } from 'node:crypto'
          import fs from 'node:fs'
          const digest = createHash('sha256').update(fs.readFileSync('release/checkout.tgz')).digest('hex')
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `sha256=${digest}\n`)
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `Release commit: ${process.env.GITHUB_SHA}\n\nTarball SHA-256: ${digest}\n`)
          JS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package
          path: release/checkout.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package
          path: release
      # Use only runner tools here. Never execute code or scripts from the artifact.
      - name: Verify release artifact
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
          EXPECTED_SHA256: ${{ needs.build.outputs.sha256 }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict'
          import { execFileSync } from 'node:child_process'
          import { createHash } from 'node:crypto'
          import fs from 'node:fs'
          const archive = 'release/checkout.tgz'
          const digest = createHash('sha256').update(fs.readFileSync(archive)).digest('hex')
          assert.match(process.env.EXPECTED_SHA256, /^[a-f0-9]{64}$/)
          assert.equal(digest, process.env.EXPECTED_SHA256, 'Release artifact digest mismatch')
          const entries = execFileSync('tar', ['-tzf', archive], { encoding: 'utf8' }).trim().split('\n').sort()
          assert.deepEqual(entries, [
            'package/LICENSE', 'package/README.md', 'package/dist/index.d.ts',
            'package/dist/index.js', 'package/package.json',
          ].sort(), 'Unexpected files in release artifact')
          const metadata = execFileSync('tar', ['-tvzf', archive], { encoding: 'utf8' }).trim().split('\n')
          assert.ok(metadata.every(entry => entry.startsWith('-')), 'Release artifact must contain only regular files')
          const pkg = JSON.parse(execFileSync('tar', ['-xOf', archive, 'package/package.json'], { encoding: 'utf8' }))
          assert.equal(pkg.name, '@tapayadot/checkout')
          assert.equal(pkg.version, process.env.EXPECTED_VERSION)
          assert.match(pkg.version, /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/)
          assert.equal(pkg.repository?.url, 'git+https://github.com/tapayadot/checkout-node.git')
          assert.deepEqual(pkg.publishConfig, { access: 'public' })
          for (const script of Object.keys(pkg.scripts ?? {})) {
            assert.ok(['build', 'typecheck', 'test'].includes(script), `Unexpected package script: ${script}`)
          }
          for (const version of Object.values(pkg.dependencies ?? {})) {
            assert.match(version, /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/, 'Runtime dependencies must use exact versions')
          }
          console.log(`Verified ${pkg.name}@${pkg.version}, SHA-256 ${digest}`)
          JS
      - name: Stage release with npm trusted publishing
        env:
          NPM_CONFIG_PROVENANCE: ${{ !github.event.repository.private }}
          NODE_AUTH_TOKEN: ''
          NPM_TOKEN: ''
        run: npm stage publish release/checkout.tgz --registry=https://registry.npmjs.org --access public --ignore-scripts
      - name: Record approval step
        run: |
          echo 'The release is staged on npm. A maintainer must inspect and approve it with 2FA on npmjs.com.' >> "$GITHUB_STEP_SUMMARY"
